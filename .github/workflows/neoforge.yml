name: NeoForge 1.21.1 development build
on:
  workflow_dispatch:
  push:
    branches: ['port/neoforge-1.21.1', 'update/neoforge-1.21.1-*']
  pull_request:
    branches: ['port/neoforge-1.21.1']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile all code and process resources
        working-directory: neoforge
        run: bash gradlew build --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: roundabout-neoforge-development
          path: neoforge/build/libs/*.jar
          if-no-files-found: error
