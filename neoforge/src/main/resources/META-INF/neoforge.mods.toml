modLoader = "javafml"
loaderVersion = "[4,)"
license = "${license}"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name} (Unofficial NeoForge Port)"
authors = "${mod_author}"
description = '''${description}'''

[[dependencies.roundabout]]
modId = "neoforge"
type = "required"
versionRange = "[21.1.265,21.2)"
ordering = "NONE"
side = "BOTH"

[[dependencies.roundabout]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1]"
ordering = "NONE"
side = "BOTH"

[[mixins]]
config = "roundabout.mixins.json"
[[mixins]]
config = "roundabout.forge.mixins.json"
